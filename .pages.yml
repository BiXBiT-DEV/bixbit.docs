media:
  input: docs/public/images
  output: /images
  rename: safe
  categories: [image]

actions:
  - name: create-pull-request
    label: Create PR to main
    workflow: pages-cms-create-pr.yml
    ref: current

content:
  - name: docs_ru
    label: Документация RU
    type: collection
    path: docs/ru
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{primary}.md"
      field: create
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: nodes
      fields: [title, order]
      primary: title
      search: [title, body]
    fields:
      - name: title
        label: Заголовок
        type: string
        required: true
      - name: seoTitle
        label: SEO-заголовок
        type: string
        description: Заголовок вкладки и поисковой выдачи. Если пусто — используется поле «Заголовок».
      - name: description
        label: SEO-описание
        type: string
        description: Кратко опишите содержание страницы для поисковой выдачи (до 160 символов).
      - name: ogImage
        label: Изображение для предпросмотра
        type: string
        description: Полный URL изображения для карточки ссылки в мессенджерах и соцсетях.
      - name: order
        label: Порядок в меню
        type: number
        default: 0
      - name: body
        label: Содержимое
        type: rich-text
        options:
          format: markdown
          switcher: true

  - name: docs_en
    label: Documentation EN
    type: collection
    path: docs/en
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{primary}.md"
      field: create
    view:
      layout: tree
      node:
        filename: index.md
        hideDirs: nodes
      fields: [title, order]
      primary: title
      search: [title, body]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: seoTitle
        label: SEO title
        type: string
        description: Browser tab and search result title. If empty, the Title field is used.
      - name: description
        label: SEO description
        type: string
        description: Briefly describe the page for search results (up to 160 characters).
      - name: ogImage
        label: Social preview image
        type: string
        description: Full image URL for link previews in messengers and social networks.
      - name: order
        label: Sidebar order
        type: number
        default: 0
      - name: body
        label: Content
        type: rich-text
        options:
          format: markdown
          switcher: true
